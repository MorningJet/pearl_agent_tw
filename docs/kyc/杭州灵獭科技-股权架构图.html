<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>杭州灵獭科技有限责任公司 — 股权架构图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: #111;
      background: #f3f3f3;
    }
    .page {
      width: 794px;
      min-height: 1123px;
      margin: 24px auto;
      padding: 64px 56px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .company {
      text-align: center;
      font-size: 18px;
      margin-bottom: 48px;
      color: #333;
    }
    .chart {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin: 40px 0 56px;
    }
    .box {
      border: 1.5px solid #222;
      background: #fff;
      padding: 18px 28px;
      text-align: center;
      min-width: 280px;
    }
    .box.company-box {
      background: #fafafa;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
    }
    .box.person {
      min-width: 220px;
      line-height: 1.55;
    }
    .box .name { font-size: 18px; font-weight: 700; }
    .box .pct { font-size: 16px; margin-top: 4px; }
    .box .tag { font-size: 13px; color: #555; margin-top: 2px; }
    .vline {
      width: 1.5px;
      height: 36px;
      background: #222;
    }
    .hline-wrap {
      position: relative;
      width: 480px;
      height: 36px;
    }
    .hline {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 1.5px;
      background: #222;
    }
    .vdrop {
      position: absolute;
      top: 0;
      width: 1.5px;
      height: 36px;
      background: #222;
    }
    .vdrop.left { left: calc(50% - 180px); }
    .vdrop.right { left: calc(50% + 180px - 1.5px); }
    .people {
      display: flex;
      justify-content: space-between;
      width: 480px;
      padding: 0 20px;
    }
    .notes {
      margin-top: 64px;
      font-size: 14px;
      line-height: 1.8;
      color: #333;
      border-top: 1px solid #ddd;
      padding-top: 20px;
    }
    .actions {
      text-align: center;
      margin: 16px auto 40px;
    }
    .actions button {
      font: inherit;
      padding: 10px 18px;
      border: 1px solid #222;
      background: #fff;
      cursor: pointer;
    }
    @media print {
      body { background: #fff; }
      .page { margin: 0; box-shadow: none; width: auto; min-height: auto; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button type="button" onclick="window.print()">打印 / 另存为 PDF</button>
  </div>
  <div class="page">
    <h1>公司股权架构图</h1>
    <div class="company">杭州灵獭科技有限责任公司</div>

    <div class="chart">
      <div class="box company-box">
        杭州灵獭科技有限责任公司<br />
        <span style="font-weight:500;font-size:14px;color:#444">有限责任公司</span>
      </div>
      <div class="vline"></div>
      <div class="hline-wrap">
        <div class="hline"></div>
        <div class="vdrop left"></div>
        <div class="vdrop right"></div>
      </div>
      <div class="people">
        <div class="box person">
          <div class="name">邱治言</div>
          <div class="pct">持股比例：90%</div>
          <div class="tag">最终受益人</div>
        </div>
        <div class="box person">
          <div class="name">程慧敏</div>
          <div class="pct">持股比例：10%</div>
          <div class="tag">股东</div>
        </div>
      </div>
    </div>

    <div class="notes">
      <div>说明：</div>
      <div>1. 本股权架构与公司章程记载一致。</div>
      <div>2. 持股比例合计 100%（邱治言 90%，程慧敏 10%）。</div>
      <div>3. 日期：2026年7月23日。</div>
    </div>
  </div>
</body>
</html>
