<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>前往付款</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f7;
        color: #292524;
        padding: 1.25rem;
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      p {
        margin: 0.45rem 0;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .muted {
        color: #78716c;
        font-size: 0.8rem;
        word-break: break-all;
      }
      a,
      button {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.65rem 1.2rem;
        border-radius: 999px;
        border: 0;
        background: #292524;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      a.secondary,
      button.secondary {
        background: #fff;
        color: #292524;
        border: 1px solid #d6d3d1;
      }
      #actions {
        display: none;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p id="title">正在準備付款…</p>
      <p class="muted" id="hint">請稍候，不要關閉此視窗</p>
      <div id="actions">
        <button type="button" id="retry">重試</button>
        <a class="secondary" id="back" href="./">返回商店</a>
      </div>
    </div>
    <script>
      (function () {
        var received = false
        var busy = false
        var lastAction = ''
        var lastPayload = null
        var title = document.getElementById('title')
        var hint = document.getElementById('hint')
        var actions = document.getElementById('actions')

        function showError(msg, detail) {
          title.textContent = msg
          hint.textContent = detail || ''
          actions.style.display = 'block'
          busy = false
        }

        function toJsonCheckoutUrl(action) {
          try {
            var u = new URL(action, location.href)
            u.pathname = u.pathname
              .replace(/\/api\/checkout-browser\/?$/, '/api/checkout')
              .replace(/\/api\/repay-browser\/?$/, '/api/repay')
            if (
              !/\/api\/checkout$/.test(u.pathname) &&
              !/\/api\/repay$/.test(u.pathname)
            ) {
              u.pathname = u.pathname.replace(/\/?$/, '') + '/api/checkout'
            }
            return u.href
          } catch (e) {
            return ''
          }
        }

        function submitNewebpay(data) {
          var form = document.createElement('form')
          form.method = 'POST'
          form.action = data.gatewayUrl
          form.acceptCharset = 'UTF-8'
          ;['MerchantID', 'TradeInfo', 'TradeSha', 'Version'].forEach(function (name) {
            var input = document.createElement('input')
            input.type = 'hidden'
            input.name = name
            input.value = String(
              name === 'Version' ? data.Version || '2.0' : data[name] || '',
            )
            form.appendChild(input)
          })
          document.body.appendChild(form)
          form.submit()
        }

        /**
         * Top-level form POST keeps the payload in the request body.
         * Do NOT use window.name + cross-origin GET (Threads/IG clear window.name).
         */
        function handoffViaFormPost(action, payload) {
          if (!action) {
            showError('付款服務網址無效', '')
            return
          }
          title.textContent = '正在前往付款服務…'
          hint.textContent = '若出現人機驗證，請在本視窗完成後繼續'
          var form = document.createElement('form')
          form.method = 'POST'
          form.action = String(action)
          form.acceptCharset = 'UTF-8'
          var input = document.createElement('input')
          input.type = 'hidden'
          input.name = 'payload'
          input.value = JSON.stringify(payload)
          form.appendChild(input)
          document.body.appendChild(form)
          form.submit()
        }

        async function submitCheckout(action, payload) {
          if (!action || payload == null || busy) return
          busy = true
          received = true
          lastAction = String(action)
          lastPayload = payload
          title.textContent = '正在建立訂單…'
          hint.textContent = '請稍候，不要關閉此視窗'
          actions.style.display = 'none'

          // Meta in-app browsers often break CORS fetch — go straight to form POST.
          var ua = navigator.userAgent || ''
          var metaWebView =
            /MicroMessenger|Line\/|FBAN|FBAV|Instagram|Threads|Barcelona|BytedanceWebview|musical_ly|TikTok/i.test(
              ua,
            )
          if (metaWebView) {
            handoffViaFormPost(action, payload)
            return
          }

          var jsonUrl = toJsonCheckoutUrl(action)
          if (jsonUrl) {
            var controller = new AbortController()
            var timer = setTimeout(function () {
              controller.abort()
            }, 12000)
            try {
              var res = await fetch(jsonUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal,
              })
              var data = await res.json().catch(function () {
                return null
              })
              clearTimeout(timer)
              if (res.ok && data && data.ok && data.paymentReady && data.gatewayUrl) {
                title.textContent = '正在前往藍新金流…'
                hint.textContent = '請稍候'
                submitNewebpay(data)
                return
              }
              if (res.ok && data && data.ok && data.paymentReady === false) {
                showError(
                  '訂單已建立，但藍新付款尚未就緒',
                  String(data.paymentError || data.merchantOrderNo || ''),
                )
                return
              }
              console.warn('[pay-bridge] json checkout failed', res.status, data)
            } catch (err) {
              clearTimeout(timer)
              console.warn('[pay-bridge] json checkout error', err)
            }
          }

          handoffViaFormPost(action, payload)
        }

        function onPayload(data, source, origin) {
          if (!data || data.type !== 'pearl-checkout-payload') return
          if (data.payload == null || !data.checkoutAction) return
          try {
            if (source)
              source.postMessage(
                { type: 'pearl-checkout-received' },
                origin || '*',
              )
          } catch (e) {}
          submitCheckout(data.checkoutAction, data.payload)
        }

        window.addEventListener('message', function (e) {
          if (received) return
          if (window.opener && e.source && e.source !== window.opener) return
          onPayload(e.data, e.source, e.origin)
        })

        function announceReady() {
          if (received) return
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(
                { type: 'pearl-checkout-bridge-ready' },
                '*',
              )
            }
          } catch (e) {}
        }

        announceReady()
        setInterval(announceReady, 400)

        setTimeout(function () {
          if (received) return
          showError(
            '尚未收到訂單資料',
            '請回到上一頁再次點擊「立即付款」，並允許彈出視窗。',
          )
        }, 8000)

        document.getElementById('retry').addEventListener('click', function () {
          if (lastAction && lastPayload != null) {
            received = false
            busy = false
            submitCheckout(lastAction, lastPayload)
          } else {
            location.href = './'
          }
        })
      })()
    </script>
  </body>
</html>
