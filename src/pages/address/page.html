<div id="page-address" class="relative hidden h-full w-full flex-col overflow-hidden bg-[#f7f7f7]">
  <header class="page-header">
    <button type="button" id="address-back" class="page-header-side rounded-full" aria-label="返回">
      <img src="/icons/back.svg" alt="" class="h-5 w-5" width="20" height="20" />
    </button>
    <h1 class="page-header-title">收件地址</h1>
    <span class="page-header-side" aria-hidden="true"></span>
  </header>
  <div id="address-scroll" class="min-h-0 flex-1 overflow-y-auto px-3 pb-24 pt-3">
    <ul id="address-list" class="space-y-3"></ul>
    <p id="address-empty" class="mt-10 hidden px-4 text-center text-sm leading-relaxed text-stone-400">
      尚無收件地址。<br />新增後可在下單時快速帶入。
    </p>
  </div>
  <div class="absolute inset-x-0 bottom-0 z-10 border-t border-stone-200 bg-white px-3 py-2.5 pb-[max(0.625rem,env(safe-area-inset-bottom,0px))]">
    <button
      type="button"
      id="address-add"
      class="w-full rounded-full bg-stone-900 py-2.5 text-sm font-semibold text-white active:opacity-90"
    >
      新增地址
    </button>
  </div>
</div>

<div
  id="address-form-modal"
  class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/35 p-5"
  role="dialog"
  aria-modal="true"
  aria-labelledby="address-form-title"
>
  <div class="max-h-[85vh] w-full max-w-sm overflow-y-auto rounded-2xl bg-white p-5 shadow-xl">
    <h2 id="address-form-title" class="text-base font-semibold text-stone-900">新增地址</h2>
    <form id="address-form" class="mt-4 space-y-3" novalidate>
      <input type="hidden" id="address-form-id" value="" />
      <div class="grid grid-cols-2 gap-2">
        <label class="block">
          <span class="text-xs font-medium text-stone-600">姓氏 <span class="text-rose-500">*</span></span>
          <input
            id="address-form-last-name"
            type="text"
            maxlength="20"
            autocomplete="family-name"
            placeholder="如：黃"
            class="mt-1.5 w-full rounded-lg border border-stone-200 px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
          />
        </label>
        <label class="block">
          <span class="text-xs font-medium text-stone-600">名字 <span class="text-rose-500">*</span></span>
          <input
            id="address-form-first-name"
            type="text"
            maxlength="40"
            autocomplete="given-name"
            placeholder="如：小明"
            class="mt-1.5 w-full rounded-lg border border-stone-200 px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
          />
        </label>
      </div>
      <label class="block">
        <span class="text-xs font-medium text-stone-600">手機號碼 <span class="text-rose-500">*</span></span>
        <input
          id="address-form-phone"
          type="tel"
          maxlength="10"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="09xxxxxxxx"
          class="mt-1.5 w-full rounded-lg border border-stone-200 px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
        />
      </label>
      <label class="block">
        <span class="text-xs font-medium text-stone-600">縣市 <span class="text-rose-500">*</span></span>
        <select
          id="address-form-city"
          autocomplete="address-level1"
          class="mt-1.5 w-full rounded-lg border border-stone-200 bg-white px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
        >
          <option value="">請選擇縣市</option>
        </select>
      </label>
      <label class="block">
        <span class="text-xs font-medium text-stone-600">鄉鎮市區 <span class="text-rose-500">*</span></span>
        <select
          id="address-form-district"
          autocomplete="address-level2"
          class="mt-1.5 w-full rounded-lg border border-stone-200 bg-white px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
          disabled
        >
          <option value="">請先選擇縣市</option>
        </select>
      </label>
      <label class="block">
        <span class="text-xs font-medium text-stone-600">郵遞區號</span>
        <input
          id="address-form-zip"
          type="text"
          maxlength="3"
          readonly
          tabindex="-1"
          class="mt-1.5 w-full rounded-lg border border-stone-200 bg-stone-50 px-3 py-2 text-sm tabular-nums text-stone-700 outline-none"
        />
      </label>
      <label class="block">
        <span class="text-xs font-medium text-stone-600">地址 <span class="text-rose-500">*</span></span>
        <input
          id="address-form-detail"
          type="text"
          maxlength="120"
          autocomplete="street-address"
          placeholder="如：忠孝東路四段100號2樓之12"
          class="mt-1.5 w-full rounded-lg border border-stone-200 px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
        />
      </label>
      <label class="flex items-center gap-2 pt-1 text-sm text-stone-700">
        <input id="address-form-default" type="checkbox" class="h-4 w-4 rounded border-stone-300" />
        設為預設地址
      </label>
      <p id="address-form-error" class="hidden text-xs text-rose-500" role="alert"></p>
      <div class="flex gap-2 pt-1">
        <button
          type="button"
          id="address-form-cancel"
          class="flex-1 rounded-lg border border-stone-300 py-2.5 text-sm font-medium text-stone-800"
        >
          取消
        </button>
        <button
          type="submit"
          class="flex-1 rounded-lg bg-stone-900 py-2.5 text-sm font-medium text-white"
        >
          儲存
        </button>
      </div>
    </form>
  </div>
</div>
