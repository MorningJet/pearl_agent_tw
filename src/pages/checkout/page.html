<div id="page-checkout" class="relative hidden h-full w-full flex-col overflow-hidden bg-[#f7f7f7]">
  <header class="page-header">
    <button type="button" id="checkout-back" class="page-header-side rounded-full" aria-label="返回">
      <img src="/icons/back.svg" alt="" class="h-5 w-5" width="20" height="20" />
    </button>
    <h1 class="page-header-title">收貨資訊</h1>
    <span class="page-header-side" aria-hidden="true"></span>
  </header>

  <div id="checkout-scroll" class="min-h-0 flex-1 overflow-y-auto px-3 pb-28 pt-3">
    <section class="rounded-2xl bg-white p-3 shadow-sm ring-1 ring-stone-100">
      <div class="flex gap-3" style="display:flex;gap:0.75rem;align-items:flex-start">
        <div
          id="checkout-product-media"
          class="h-20 w-20 shrink-0 overflow-hidden rounded-xl bg-stone-50"
          style="flex-shrink:0;width:5rem;height:5rem;overflow:hidden;border-radius:0.75rem"
        ></div>
        <div
          id="checkout-product-meta"
          style="flex:1;min-width:0;display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem"
        >
          <p
            id="checkout-product-title"
            class="text-sm font-medium text-stone-900"
            style="margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.875rem;font-weight:500"
          >
            手鍊設計
          </p>
          <p
            id="checkout-product-price"
            class="text-sm font-semibold tabular-nums text-stone-900"
            style="margin:0;flex-shrink:0;font-size:0.875rem;font-weight:600;white-space:nowrap"
          ></p>
        </div>
      </div>
    </section>

    <form id="checkout-form" class="mt-3 space-y-3" novalidate>
      <section class="rounded-2xl bg-white px-4 py-4 shadow-sm ring-1 ring-stone-100">
        <p class="text-sm font-semibold text-stone-900">收件資料</p>
        <div class="mt-3 space-y-3">
          <label class="block">
            <span class="text-xs font-medium text-stone-600">電子信箱 <span class="text-rose-500">*</span></span>
            <input
              id="checkout-email"
              type="email"
              autocomplete="email"
              inputmode="email"
              maxlength="80"
              placeholder="用於訂單通知與會員識別"
              class="mt-1.5 w-full rounded-lg border border-stone-200 px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
            />
          </label>

          <div class="grid grid-cols-2 gap-2">
            <label class="block">
              <span class="text-xs font-medium text-stone-600">姓氏 <span class="text-rose-500">*</span></span>
              <input
                id="checkout-last-name"
                type="text"
                maxlength="20"
                autocomplete="family-name"
                placeholder="如：黃"
                class="mt-1.5 w-full rounded-lg border border-stone-200 px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
              />
            </label>
            <label class="block">
              <span class="text-xs font-medium text-stone-600">名字 <span class="text-rose-500">*</span></span>
              <input
                id="checkout-first-name"
                type="text"
                maxlength="30"
                autocomplete="given-name"
                placeholder="如：小明"
                class="mt-1.5 w-full rounded-lg border border-stone-200 px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
              />
            </label>
          </div>

          <label class="block">
            <span class="text-xs font-medium text-stone-600">手機號碼 <span class="text-rose-500">*</span></span>
            <div
              class="mt-1.5 flex w-full overflow-hidden rounded-lg border border-stone-200 focus-within:border-stone-400"
            >
              <span
                class="inline-flex shrink-0 items-center border-r border-stone-200 bg-stone-50 px-3 text-sm font-medium tabular-nums text-stone-700"
                aria-hidden="true"
                >09</span
              >
              <input
                id="checkout-phone"
                type="tel"
                inputmode="numeric"
                maxlength="8"
                autocomplete="tel-national"
                placeholder="12345678"
                aria-label="手機號碼後八碼"
                class="min-w-0 flex-1 border-0 bg-white px-3 py-2 text-sm tabular-nums text-stone-900 outline-none"
              />
            </div>
          </label>

          <label class="block">
            <span class="text-xs font-medium text-stone-600">國家／地區 <span class="text-rose-500">*</span></span>
            <input
              id="checkout-country"
              type="text"
              value="台灣"
              readonly
              tabindex="-1"
              autocomplete="country-name"
              class="mt-1.5 w-full rounded-lg border border-stone-200 bg-stone-50 px-3 py-2 text-sm text-stone-700 outline-none"
            />
          </label>

          <div class="grid grid-cols-[minmax(0,1.1fr)_minmax(0,1.2fr)_4.75rem] gap-2">
            <label class="block min-w-0">
              <span class="text-xs font-medium text-stone-600">縣市 <span class="text-rose-500">*</span></span>
              <select
                id="checkout-city"
                autocomplete="address-level1"
                class="mt-1.5 w-full rounded-lg border border-stone-200 bg-white px-2 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
              >
                <option value="">請選擇</option>
              </select>
            </label>
            <label class="block min-w-0">
              <span class="text-xs font-medium text-stone-600">鄉鎮市區 <span class="text-rose-500">*</span></span>
              <select
                id="checkout-district"
                autocomplete="address-level2"
                class="mt-1.5 w-full rounded-lg border border-stone-200 bg-white px-2 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
              >
                <option value="">請選擇</option>
              </select>
            </label>
            <label class="block min-w-0">
              <span class="text-xs font-medium text-stone-600">郵遞區號</span>
              <input
                id="checkout-zip"
                type="text"
                inputmode="numeric"
                maxlength="3"
                readonly
                tabindex="-1"
                autocomplete="postal-code"
                placeholder="—"
                class="mt-1.5 w-full cursor-default rounded-lg border border-stone-200 bg-stone-50 px-1.5 py-2 text-center text-sm tabular-nums text-stone-700 outline-none"
              />
            </label>
          </div>

          <label class="block">
            <span class="text-xs font-medium text-stone-600">地址 <span class="text-rose-500">*</span></span>
            <input
              id="checkout-address"
              type="text"
              maxlength="120"
              autocomplete="street-address"
              placeholder="如：忠孝東路四段100號2樓之12"
              class="mt-1.5 w-full rounded-lg border border-stone-200 px-3 py-2 text-sm text-stone-900 outline-none focus:border-stone-400"
            />
          </label>
        </div>
      </section>
    </form>
  </div>

  <div
    class="shrink-0 border-t border-stone-200 bg-white px-3 py-2.5 pb-[max(0.625rem,env(safe-area-inset-bottom,0px))]"
  >
    <button
      type="button"
      id="checkout-submit"
      class="w-full rounded-full bg-stone-900 py-2.5 text-sm font-semibold text-white active:opacity-90"
    >
      立即付款
    </button>
  </div>

  <!-- Shown when payment opens in a breakout window (Cloudflare challenge must be visible). -->
  <div
    id="checkout-pay-overlay"
    class="absolute inset-0 z-30 hidden flex-col bg-white/95 px-5"
    style="padding-top: max(var(--safe-top, 0px), env(safe-area-inset-top, 0px))"
    role="dialog"
    aria-modal="true"
    aria-labelledby="checkout-pay-overlay-title"
  >
    <div class="flex min-h-0 flex-1 flex-col items-center justify-center text-center">
      <h2
        id="checkout-pay-overlay-title"
        class="text-base font-semibold text-stone-900"
      >
        請在新視窗完成付款
      </h2>
      <p
        id="checkout-pay-overlay-body"
        class="mt-3 max-w-xs text-sm leading-relaxed text-stone-600"
      >
        付款頁已在新視窗開啟。若出現人機驗證，請在該視窗完成後繼續。
      </p>
      <button
        type="button"
        id="checkout-pay-retry"
        class="mt-8 w-full max-w-xs rounded-full bg-stone-900 py-2.5 text-sm font-semibold text-white active:opacity-90"
      >
        重新開啟付款
      </button>
      <button
        type="button"
        id="checkout-pay-dismiss"
        class="mt-3 w-full max-w-xs rounded-full border border-stone-300 bg-white py-2.5 text-sm font-medium text-stone-700 active:bg-stone-50"
      >
        返回修改資料
      </button>
    </div>
  </div>
</div>
