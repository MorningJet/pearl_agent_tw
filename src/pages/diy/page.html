<div id="page-diy" class="hidden h-full w-full flex-col overflow-hidden bg-white">
  <header class="page-header">
    <button type="button" id="diy-back" class="page-header-side rounded-full" aria-label="返回">
      <img src="/icons/back.svg" alt="" class="h-5 w-5" width="20" height="20" />
    </button>
    <h1 class="page-header-title">DIY 畫布</h1>
    <span class="page-header-side" aria-hidden="true"></span>
  </header>

  <!-- Upper half: canvas + overlays -->
  <section class="relative min-h-0 flex-[1.5] bg-[#f9f9f9]">
    <canvas id="bracelet-canvas" class="block h-full w-full touch-none"></canvas>

    <header
      id="top-bar"
      class="absolute inset-x-0 top-0 z-20 flex items-center gap-2 px-3 pt-2 pb-1.5"
    >
      <button
        type="button"
        id="btn-wrist"
        class="rounded-full bg-white/90 px-3.5 py-2 text-sm shadow-sm ring-1 ring-stone-200"
      >
        手圍 <span id="wrist-value">0.0</span>cm
        <span id="wrist-status" class="ml-1 text-rose-500"></span>
      </button>
      <button
        type="button"
        id="btn-price"
        class="rounded-full bg-white/90 px-3.5 py-2 text-sm shadow-sm ring-1 ring-stone-200"
      >
        價格 NT$<span id="price-value">0</span>
      </button>
      <button
        type="button"
        id="btn-help"
        class="ml-auto inline-flex items-center gap-1.5 rounded-full bg-white/90 px-3.5 py-2 text-sm shadow-sm ring-1 ring-stone-200"
        aria-label="說明"
      >
        <img src="/icons/help.svg" alt="" class="h-4 w-4" width="16" height="16" />
        說明
      </button>
    </header>

    <div id="middle-bar" class="absolute inset-x-0 bottom-4 z-10 flex items-center gap-2.5 px-3">
      <button
        type="button"
        id="btn-clear"
        class="inline-flex items-center justify-center rounded-full bg-white px-3.5 py-2 shadow-sm ring-1 ring-stone-200"
        aria-label="全部清除"
        title="清除"
      >
        <img src="/icons/trash.svg" alt="" class="h-5 w-5" width="20" height="20" />
      </button>
      <div class="flex-1"></div>
      <button
        type="button"
        id="btn-recommend"
        class="inline-flex items-center gap-1.5 rounded-full bg-white px-4 py-2 text-sm font-medium text-stone-800 shadow-sm ring-1 ring-stone-300"
        aria-label="推薦設計"
        title="推薦設計"
      >
        <img src="/icons/recommend.svg" alt="" class="h-4 w-4" width="16" height="16" />
        推薦
      </button>
      <button
        type="button"
        id="btn-make"
        class="inline-flex items-center gap-1.5 rounded-full bg-stone-900 px-4 py-2 text-sm font-medium text-white"
      >
        <img
          src="/icons/done.svg"
          alt=""
          class="h-4 w-4 brightness-0 invert"
          width="16"
          height="16"
        />
        立即製作
      </button>
    </div>
  </section>

  <!-- Lower half: product shelf -->
  <section id="shelf" class="flex min-h-0 flex-1 flex-col border-t border-stone-200 bg-white">
    <div class="flex shrink-0 items-center gap-1 border-b border-stone-100 px-2 pt-1">
      <button
        type="button"
        data-type="bead"
        class="shelf-tab shelf-tab-active px-3 py-2.5 text-sm font-semibold text-stone-900"
      >
        珠子
      </button>
      <button
        type="button"
        data-type="accessory"
        class="shelf-tab px-3 py-2.5 text-sm text-stone-400"
      >
        配件
      </button>
      <div class="ml-auto pr-2 text-xs text-stone-400">
        <span id="shelf-count">0</span>
      </div>
    </div>
    <div class="flex min-h-0 flex-1">
      <aside
        id="shelf-categories"
        class="w-[5.25rem] shrink-0 overflow-y-auto bg-stone-50 text-xs"
      ></aside>
      <div
        id="shelf-grid"
        class="grid flex-1 auto-rows-max grid-cols-3 content-start gap-2 overflow-y-auto p-2"
      ></div>
    </div>
  </section>
</div>

<!-- DIY help modal (fixed; lives with DIY page markup) -->
<div
  id="help-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/35 p-6"
  role="dialog"
  aria-modal="true"
>
  <div class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl">
    <h2 class="text-base font-semibold">如何設計</h2>
    <ol class="mt-3 list-decimal space-y-2 pl-4 text-sm text-stone-600">
      <li>點選下方珠子或配件，即可加入手鍊；長按商品卡可查看實拍圖。</li>
      <li>沿著圓環拖曳，可調整排列順序。</li>
      <li>往圓環外拖曳，可移除單顆珠子。</li>
      <li>點垃圾桶圖示，可清除整組設計。</li>
    </ol>
    <button
      type="button"
      id="help-close"
      class="mt-5 w-full rounded-lg bg-stone-900 py-2.5 text-sm font-medium text-white"
    >
      知道了
    </button>
  </div>
</div>

<!-- Shelf product lifestyle photo (long-press) -->
<div
  id="shelf-lifestyle-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/55 p-5"
  role="dialog"
  aria-modal="true"
  aria-labelledby="shelf-lifestyle-title"
>
  <div
    class="flex max-h-[min(90vh,720px)] w-full max-w-md flex-col overflow-hidden rounded-2xl bg-white shadow-xl"
  >
    <div class="flex items-center justify-between border-b border-stone-100 px-4 py-3">
      <h2 id="shelf-lifestyle-title" class="text-base font-semibold text-stone-900">
        實拍圖
      </h2>
      <button
        type="button"
        id="shelf-lifestyle-close"
        class="rounded-lg px-2 py-1 text-sm text-stone-500"
        aria-label="關閉"
      >
        關閉
      </button>
    </div>
    <div class="flex min-h-0 flex-1 items-center justify-center bg-stone-50 p-3">
      <img
        id="shelf-lifestyle-img"
        alt=""
        class="max-h-[min(70vh,560px)] w-full object-contain"
      />
    </div>
  </div>
</div>
