<div id="page-my-designs" class="hidden h-full w-full flex-col overflow-hidden bg-[#f7f7f7]">
  <header class="page-header">
    <button type="button" id="my-designs-back" class="page-header-side rounded-full" aria-label="返回">
      <img src="/icons/back.svg" alt="" class="h-5 w-5" width="20" height="20" />
    </button>
    <h1 class="page-header-title">我的設計</h1>
    <span class="page-header-side" aria-hidden="true"></span>
  </header>

  <div id="my-designs-scroll" class="min-h-0 flex-1 overflow-y-auto pb-[4.5rem]">
    <section id="my-designs-history" class="pt-4" aria-label="已儲存的設計">
      <div class="mb-2.5 flex items-center justify-between px-4">
        <h2 class="text-[0.95rem] font-semibold text-stone-900">我的設計</h2>
      </div>

      <div
        id="my-designs-rail"
        class="flex gap-3 overflow-x-auto px-4 pb-1 [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
      ></div>

      <p
        id="my-designs-empty"
        class="hidden px-4 pb-1 text-xs text-stone-400"
      >
        尚無已儲存的設計。完成一組設計後會顯示在這裡。
      </p>
    </section>

    <section id="my-published-history" class="mt-5" aria-label="已發佈的設計">
      <div class="mb-2.5 flex items-center justify-between px-4">
        <h2 class="text-[0.95rem] font-semibold text-stone-900">我的發佈</h2>
      </div>

      <div
        id="my-published-rail"
        class="flex gap-3 overflow-x-auto px-4 pb-1 [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
      ></div>

      <p
        id="my-published-empty"
        class="hidden px-4 pb-1 text-xs text-stone-400"
      >
        尚無發佈。在設計詳情頁發佈到廣場後會顯示在這裡。
      </p>
    </section>

    <section class="mt-5 px-4" aria-label="新增設計">
      <button
        type="button"
        id="my-designs-add"
        class="flex w-full flex-col items-center justify-center gap-3 rounded-2xl bg-white py-14 shadow-sm ring-1 ring-stone-100"
      >
        <span
          class="flex h-12 w-12 items-center justify-center text-4xl font-light leading-none text-stone-800"
          aria-hidden="true"
          >+</span
        >
        <span class="text-sm font-medium text-stone-800">新增設計</span>
      </button>
    </section>

    <p id="my-designs-footer" class="mt-5 px-6 pb-6 text-center text-[0.65rem] leading-relaxed text-stone-400">
      已有 9,999 位設計師把靈感變成現實
    </p>
  </div>
</div>

<div
  id="unpublish-confirm-modal"
  class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/35 p-5"
  role="dialog"
  aria-modal="true"
  aria-labelledby="unpublish-confirm-title"
>
  <div class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl">
    <h2 id="unpublish-confirm-title" class="text-base font-semibold text-stone-900">確認下架？</h2>
    <p id="unpublish-confirm-desc" class="mt-2 text-sm leading-relaxed text-stone-600">
      下架後此設計將從設計廣場移除，並保留在「我的設計」中。
    </p>
    <div class="mt-5 flex gap-2">
      <button
        type="button"
        id="unpublish-confirm-cancel"
        class="flex-1 rounded-lg border border-stone-300 py-2.5 text-sm font-medium text-stone-800"
      >
        取消
      </button>
      <button
        type="button"
        id="unpublish-confirm-ok"
        class="flex-1 rounded-lg bg-stone-900 py-2.5 text-sm font-medium text-white"
      >
        下架
      </button>
    </div>
  </div>
</div>
