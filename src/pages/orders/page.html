<div id="page-orders" class="hidden h-full w-full flex-col overflow-hidden bg-[#f7f7f7]">
  <header class="page-header">
    <button type="button" id="orders-back" class="page-header-side rounded-full" aria-label="返回">
      <img src="/icons/back.svg" alt="" class="h-5 w-5" width="20" height="20" />
    </button>
    <h1 class="page-header-title">我的訂單</h1>
    <span class="page-header-side" aria-hidden="true"></span>
  </header>
  <div id="orders-scroll" class="min-h-0 flex-1 overflow-y-auto px-3 pb-6 pt-3">
    <div
      id="orders-tabs"
      class="-mx-1 flex gap-1.5 overflow-x-auto px-1 pb-0.5 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
      role="tablist"
    >
      <button
        type="button"
        class="orders-tab shrink-0 rounded-full bg-stone-100 px-3 py-2 text-center text-xs font-medium text-stone-900"
        data-orders-filter="all"
      >
        全部
      </button>
      <button
        type="button"
        class="orders-tab shrink-0 rounded-full px-3 py-2 text-center text-xs font-medium text-stone-500"
        data-orders-filter="unpaid"
      >
        未付款
      </button>
      <button
        type="button"
        class="orders-tab shrink-0 rounded-full px-3 py-2 text-center text-xs font-medium text-stone-500"
        data-orders-filter="scheduling"
      >
        排單中
      </button>
      <button
        type="button"
        class="orders-tab shrink-0 rounded-full px-3 py-2 text-center text-xs font-medium text-stone-500"
        data-orders-filter="designing"
      >
        設計中
      </button>
      <button
        type="button"
        class="orders-tab shrink-0 rounded-full px-3 py-2 text-center text-xs font-medium text-stone-500"
        data-orders-filter="shipping"
      >
        運送中
      </button>
      <button
        type="button"
        class="orders-tab shrink-0 rounded-full px-3 py-2 text-center text-xs font-medium text-stone-500"
        data-orders-filter="pickup"
      >
        待提貨
      </button>
      <button
        type="button"
        class="orders-tab shrink-0 rounded-full px-3 py-2 text-center text-xs font-medium text-stone-500"
        data-orders-filter="done"
      >
        已完成
      </button>
      <button
        type="button"
        class="orders-tab shrink-0 rounded-full px-3 py-2 text-center text-xs font-medium text-stone-500"
        data-orders-filter="closed"
      >
        已關閉
      </button>
    </div>

    <ul id="orders-list" class="mt-3 space-y-3"></ul>
    <p id="orders-empty" class="mt-10 hidden px-4 text-center text-sm leading-relaxed text-stone-400">
      尚無訂單。<br />在設計詳情點「立即購買」完成下單後會顯示在這裡。
    </p>
  </div>
</div>
